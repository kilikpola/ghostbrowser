<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>New tab</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1c22;color:#e6e7eb;font-family:sans-serif}
.wrap{padding:24% 24px 24px;text-align:center}
.mark{width:44px;height:44px;margin:0 auto 22px;opacity:.9}
form{max-width:560px;margin:0 auto}
input{width:100%;box-sizing:border-box;-webkit-box-sizing:border-box;font-size:16px;padding:15px 20px;border:0;border-radius:16px;background:#23262e;color:#e6e7eb;outline:none;-webkit-appearance:none;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
input:focus{box-shadow:0 0 0 2px #8e9eff}
input::-webkit-input-placeholder{color:#9a9ca8}
</style></head>
<body><div class="wrap">
<svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
  <path fill="#2d3039" d="M22 4c-8.3 0-15 6.7-15 15v20.5l5-3.5 5 3.5 5-3.5 5 3.5 5-3.5 5 3.5V19c0-8.3-6.7-15-15-15z"/>
  <circle cx="16.5" cy="19" r="2.6" fill="#8e9eff"/><circle cx="27.5" cy="19" r="2.6" fill="#8e9eff"/>
</svg>
<form onsubmit="go();return false;">
<input id="q" type="text" placeholder="Search or enter address" autocomplete="off" autocapitalize="off" aria-label="Search or enter address">
</form>
</div>
<script>
function go(){var v=document.getElementById('q').value;if(v){location.href='ghost://search?q='+encodeURIComponent(v);}}
</script>
</body></html>
